<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Ad - AI Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 50px;
        }

        /* Decorative circles */
        .accent-circle-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            z-index: 1;
        }

        .accent-circle-2 {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .top-section {
            text-align: left;
            margin-bottom: 40px;
        }

        .badge {
            display: inline-block;
            background: #4f46e5;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 56px;
            font-weight: 800;
            line-height: 1.2;
            color: #0f172a;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .highlight {
            background: linear-gradient(120deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .middle-section {
            text-align: center;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
        }

        .stat-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .stat-number {
            font-size: 48px;
            font-weight: 900;
            color: #4f46e5;
            margin-bottom: 8px;
        }

        .stat-text {
            font-size: 16px;
            color: #64748b;
            font-weight: 500;
        }

        .bottom-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        .description {
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
            flex: 1;
        }

        .cta-button {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            white-space: nowrap;
            margin-left: 20px;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .logo {
            font-size: 12px;
            font-weight: 700;
            color: #4f46e5;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: absolute;
            bottom: 50px;
            left: 50px;
            z-index: 3;
        }

        @media (max-width: 768px) {
            .container {
                width: 100%;
                padding: 40px 30px;
            }

            h1 {
                font-size: 36px;
            }

            .stat-number {
                font-size: 36px;
            }

            .bottom-section {
                flex-direction: column;
                gap: 15px;
            }

            .cta-button {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="accent-circle-1"></div>
        <div class="accent-circle-2"></div>

        <div class="content">
            <div class="top-section">
                <div class="badge">AI Automation</div>
                <h1>Save <span class="highlight">20+ Hours</span> Per Week</h1>
            </div>

            <div class="middle-section">
                <div class="stat-box">
                    <div class="stat-number">$178K</div>
                    <div class="stat-text">Annual Savings (Real Client)</div>
                </div>
            </div>

            <div class="bottom-section">
                <div class="description">
                    Custom AI agents automate your workflows. Your team focuses on growth.
                </div>
                <button class="cta-button">Book Free Audit</button>
            </div>
        </div>

        <div class="logo">aibizmod</div>
    </div>
</body>
</html>
